<h2>◆クーポン詳細◆</h2><dl><dt></dt>
<dd class="list"><span style="font-weight: 700; color: #F6072E;">メガコラボ30%クーポンはメガコラボタグがついている商品に使用することができます。</span></dd>
<dd class="list">メガコラボ30%クーポンはアイテム単位で使用する割引クーポンで、商品詳細ページで適用することができます。<br> (SHOPクーポンと併用可能)</dd>
<dd class="list">それぞれのクーポンは、イベント期間中お一人様当たり1回のみもらうことができます。</dd>
<dd class="list">複数IDでの取得など不正行為が確認された場合、キャンセル等を行う場合があります。</dd>
<dd class="list">商品券など換金性のある商品にはクーポンの適用が不可です。</dd>
<dd class="list">クーポンは予告なく変更終了される場合がありますので、予めご了承ください。</dd>
</dl></div></div></div></div></div></div>
